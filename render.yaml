services:
  - type: web
    name: auralcraftverse
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    previews:
      generation: automatic
    routes:
      - type: rewrite
        source: /mixmind
        destination: /index.html
      - type: rewrite
        source: /hush-denoise
        destination: /index.html
      - type: rewrite
        source: /split-it
        destination: /index.html
      - type: rewrite
        source: /tools/*
        destination: /index.html
      - type: rewrite
        source: /guides/*
        destination: /index.html
      # Catch-all SPA fallback so direct tool and guide URLs resolve to the Vite app.
      - type: rewrite
        source: /*
        destination: /index.html
