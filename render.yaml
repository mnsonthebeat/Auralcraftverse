services:
  - type: web
    name: auralcraftverse
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    previews:
      generation: automatic
    routes:
      - type: rewrite
        source: /tools/*
        destination: /index.html
      - type: rewrite
        source: /guides/*
        destination: /index.html
