name: Build Auralcraftverse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build React/Vite site
        run: npm run build
      - name: Save production build
        uses: actions/upload-artifact@v4
        with:
          name: auralcraftverse-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
